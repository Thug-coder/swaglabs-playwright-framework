name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      
      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        run: npx playwright test

      - name: Publish test summary
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const p = "test-results/results.json";
          if (!fs.existsSync(p)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "## Playwright Test Results\n\nNo JSON results were generated. Check the test logs.\n");
            process.exit(0);
          }
          const r = JSON.parse(fs.readFileSync(p, "utf8"));
          const stats = r.stats || {};
          const passed = stats.expected ?? 0;
          const failed = (stats.unexpected ?? 0) + (stats.flaky ?? 0);
          const skipped = stats.skipped ?? 0;
          const total = passed + failed + skipped;
          const duration = ((stats.duration ?? 0) / 1000).toFixed(2);
          const summary = [
            "## Playwright Test Results",
            "",
            "| Metric | Count |",
            "|---|---:|",
            `| ✅ Passed | ${passed} |`,
            `| ❌ Failed / Flaky | ${failed} |`,
            `| ⏭️ Skipped | ${skipped} |`,
            `| **Total** | **${total}** |`,
            "",
            `**Duration:** ${duration} seconds`,
            ""
          ].join("\n");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          '

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail workflow if tests failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
